<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hetai Network & Fleet Operations Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hetaidark: '#f3f4f6',
                        hetaisidebar: '#111827',
                        hetaicard: '#ffffff',
                        hetaiborder: '#e5e7eb',
                        hetaiacent: '#eab308'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background: white !important; color: #000 !important; font-size: 11px !important; }
            aside, header, button, .no-print { display: none !important; }
            main { padding: 0 !important; width: 100% !important; margin: 0 !important; }
            #tab-billing { display: block !important; }
            #tab-billing .bg-white { border: none !important; box-shadow: none !important; padding: 0 !important; }
            table { width: 100% !important; border-collapse: collapse !important; font-size: 10px !important; }
            th, td { border: 1px solid #333 !important; padding: 4px !important; color: #000 !important; }
            th { background-color: #f2f2f2 !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-gray-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Header Bar -->
    <header class="w-full bg-[#111827] border-b border-gray-800 h-14 px-4 flex items-center justify-between sticky top-0 z-50 text-white shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-full overflow-hidden bg-white shrink-0 border border-amber-500/50 flex items-center justify-center p-0.5">
                <i class="fa-solid fa-network-wired text-amber-500 text-sm"></i>
            </div>
            <div class="text-xs">
                <div class="font-bold text-white tracking-wide">Hetai Network.</div>
                <div class="text-slate-400 text-[10px]">泰网络 / HT-557970</div>
            </div>
        </div>
        <div class="flex items-center space-x-3 text-xs">
            <span class="bg-green-500/20 text-green-400 border border-green-500/30 px-2.5 py-1 rounded-full font-medium hidden sm:inline-block">
                <i class="fa-solid fa-circle text-[6px] mr-1.5"></i> ระบบเชื่อมต่อสมบูรณ์
            </span>
            <span id="global-last-updated" class="font-mono text-slate-400 hidden md:inline-block">อัปเดตล่าสุด: -</span>
        </div>
    </header>

    <div class="flex-1 flex flex-col lg:flex-row">
        <!-- Sidebar Navigation -->
        <aside class="w-full lg:w-64 bg-hetaisidebar border-r border-gray-800 flex flex-col shrink-0 min-h-[calc(100vh-3.5rem)] text-slate-100">
            <nav class="flex-1 p-2 space-y-1 overflow-y-auto text-xs">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full px-3 py-2.5 rounded bg-slate-800 text-white font-medium flex items-center space-x-3 transition">
                    <i class="fa-solid fa-house w-4 text-center text-amber-400"></i>
                    <span>คอนโซล (Dashboard)</span>
                </button>

                <!-- Dropdown: การจัดการการดำเนินงาน -->
                <div class="pt-1">
                    <button onclick="toggleMenu('operations')" class="w-full px-3 py-2.5 rounded text-slate-300 hover:text-white hover:bg-slate-800 flex items-center justify-between transition">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-truck-fast w-4 text-center text-yellow-400"></i>
                            <span class="font-bold">การจัดการการดำเนินงาน</span>
                        </div>
                        <i id="operations-chevron" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
                    </button>
                    <div id="operations-submenu" class="pl-4 pt-1 space-y-1 hidden">
                        <button onclick="switchTab('parcel-details')" id="nav-parcel-details" class="w-full px-3 py-2 rounded text-slate-400 hover:text-white hover:bg-slate-800 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-box-open text-yellow-400 text-[10px] w-4 text-center"></i>
                            <span>รายละเอียดการนำจ่ายพัสดุ</span>
                        </button>
                        <button onclick="switchTab('daily-input')" id="nav-daily-input" class="w-full px-3 py-2 rounded text-slate-400 hover:text-white hover:bg-slate-800 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-pen-to-square text-amber-400 text-[10px] w-4 text-center"></i>
                            <span>หน้าสำหรับคีย์ยอด POD</span>
                        </button>
                    </div>
                </div>

                <!-- Dropdown: การจัดการพนักงาน -->
                <div class="pt-1">
                    <button onclick="toggleMenu('employees-menu')" class="w-full px-3 py-2.5 rounded text-slate-300 hover:text-white hover:bg-slate-800 flex items-center justify-between transition">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-users w-4 text-center text-blue-400"></i>
                            <span class="font-bold">การจัดการพนักงาน</span>
                        </div>
                        <i id="employees-menu-chevron" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
                    </button>
                    <div id="employees-menu-submenu" class="pl-4 pt-1 space-y-1 hidden">
                        <button onclick="switchTab('employees'); switchEmpSubTab('directory');" id="nav-employees-dir" class="w-full px-3 py-2 rounded text-slate-400 hover:text-white hover:bg-slate-800 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-user-group text-blue-400 text-[10px] w-4 text-center"></i>
                            <span>รายชื่อพนักงานทั้งหมด</span>
                        </button>
                        <button onclick="switchTab('employees'); switchEmpSubTab('recruiters');" id="nav-employees-rec" class="w-full px-3 py-2 rounded text-slate-400 hover:
